<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'">
<title>PLAIK — встановлення</title>
<style>
:root {
  --ink: #1b2430;
  --muted: #5b6573;
  --line: #d9dee7;
  --paper: #f4f6f9;
  --card: #ffffff;
  --brand: #1457d9;
  --brand-dark: #0d3ea3;
  --ok: #218358;
  --warn: #b45309;
  --bad: #c0353a;
  --sidebar: #151c28;
  --sidebar-text: #d7deea;
  font-family: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
body { display: flex; min-height: 100vh; }
.rail {
  width: 280px; flex: 0 0 280px; background: var(--sidebar); color: var(--sidebar-text);
  padding: 2rem 1.25rem; display: flex; flex-direction: column; gap: 2rem;
}
.brand { display: flex; align-items: center; gap: .75rem; color: #fff; text-decoration: none; }
.brand svg { width: 40px; height: 40px; }
.brand strong { font-size: 1.35rem; letter-spacing: .04em; }
.brand span { display: block; font-size: .75rem; color: #9aa7bc; font-weight: 400; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.steps button {
  width: 100%; display: flex; gap: .75rem; align-items: center; text-align: left;
  border: 0; background: transparent; color: inherit; padding: .65rem .5rem; border-radius: .5rem;
  cursor: default;
}
.steps .num {
  width: 1.7rem; height: 1.7rem; border-radius: 999px; display: grid; place-items: center;
  border: 1px solid #3a465a; font-size: .75rem; font-weight: 700;
}
.steps li.done .num { background: var(--ok); border-color: var(--ok); color: #fff; }
.steps li.current { background: #243044; color: #fff; }
.steps li.current .num { background: var(--brand); border-color: var(--brand); color: #fff; }
.stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top {
  padding: 1.25rem 2rem; border-bottom: 1px solid var(--line); background: var(--card);
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
}
.top select, .field input, .field select, .field textarea {
  border: 1px solid var(--line); border-radius: .4rem; padding: .55rem .7rem; font: inherit; background: #fff;
}
.sheet { flex: 1; padding: 2rem; overflow: auto; }
.panel {
  max-width: 52rem; background: var(--card); border: 1px solid var(--line); border-radius: .75rem;
  padding: 1.75rem 1.75rem 1.25rem; min-height: 28rem;
}
h1 { margin: 0 0 .5rem; font-size: 1.7rem; }
.lead { color: var(--muted); margin: 0 0 1.5rem; line-height: 1.5; }
.grid { display: grid; gap: 1rem; }
.grid.two { grid-template-columns: 1fr 1fr; }
.field { display: grid; gap: .35rem; }
.field label { font-size: .85rem; font-weight: 650; }
.checks { display: grid; gap: .5rem; margin: 0; padding: 0; list-style: none; }
.checks li {
  display: flex; gap: .75rem; align-items: flex-start; padding: .75rem .85rem;
  border: 1px solid var(--line); border-radius: .5rem; background: #fbfcfe;
}
.dot { width: .85rem; height: .85rem; border-radius: 999px; margin-top: .2rem; flex: 0 0 auto; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.actions {
  display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; padding-top: 1rem;
  border-top: 1px solid var(--line);
}
button.primary, button.ghost {
  border: 0; border-radius: .4rem; padding: .7rem 1.2rem; font: inherit; font-weight: 700; cursor: pointer;
}
button.primary { background: var(--brand); color: #fff; }
button.primary:hover { background: var(--brand-dark); }
button.primary:disabled { opacity: .5; cursor: not-allowed; }
button.ghost { background: #eef1f6; color: var(--ink); }
.flash { padding: .75rem .9rem; border-radius: .5rem; margin-bottom: 1rem; }
.flash.bad { background: #fdecec; color: #8a1f24; }
.flash.ok { background: #e8f6ee; color: #145c38; }
.progress { height: .55rem; background: #e6ebf3; border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--brand); width: 0; transition: width .3s; }
.log { font-family: ui-monospace, monospace; font-size: .85rem; color: var(--muted); display: grid; gap: .35rem; }
.done-box { text-align: center; padding: 2rem 1rem; }
.done-box h1 { color: var(--ok); }
@media (max-width: 860px) {
  body { flex-direction: column; }
  .rail { width: auto; flex: none; flex-direction: row; align-items: center; overflow: auto; }
  .steps { display: flex; }
  .grid.two { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<aside class="rail">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#1457d9"/>
      <path d="M17 43V21h8l7 11 7-11h8v22h-8V33l-7 10-7-10v10z" fill="#fff"/>
    </svg>
    <div><strong>PLAIK</strong><span id="brand-sub">Встановлення</span></div>
  </div>
  <ol class="steps" id="steps"></ol>
</aside>
<section class="stage">
  <header class="top">
    <div id="top-title"></div>
    <label>Мова
      <select id="lang">
        <option value="uk">Українська</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>
  <div class="sheet">
    <div class="panel" id="panel"></div>
  </div>
</section>
<script>
const I18N = {
  uk: {
    brand: "Встановлення",
    steps: ["Вітання", "Перевірка системи", "Сайт", "База даних", "Адміністратор", "Встановлення"],
    welcomeTitle: "Ласкаво просимо до PLAIK",
    welcomeLead: "Майстер проведе вас кроками, як класичний веб-інсталятор: перевірка хоста, сайт, база даних і обліковий запис адміністратора.",
    tokenLabel: "Токен інсталятора",
    tokenHelp: "Локальний доступ можна підтвердити токеном з /etc/plaik/plaik.env. На loopback інсталятор може працювати без нього, якщо так налаштовано.",
    next: "Далі",
    back: "Назад",
    start: "Почати встановлення",
    checkTitle: "Сумісність системи",
    checkLead: "Інсталятор бачить поточний стан хоста перед записом конфігурації.",
    siteTitle: "Інформація про сайт",
    siteLead: "Домен стане публічною HTTPS-адресою. Без схеми і шляху.",
    domain: "Домен",
    locale: "Локаль",
    timezone: "Часовий пояс",
    dbTitle: "Налаштування бази даних",
    dbLead: "Оберіть знайдену порожню базу, введіть існуючу вручну або створіть нову через CLI, якщо інсталятор не має peer-доступу postgres.",
    source: "Джерело",
    useDetected: "Використати знайдену порожню",
    manual: "Вказати вручну",
    host: "Хост",
    port: "Порт",
    database: "База даних",
    migrator: "Користувач міграцій",
    runtime: "Користувач runtime",
    checkpoint: "Користувач checkpoint",
    password: "Пароль",
    ssl: "SSL mode",
    adminTitle: "Обліковий запис адміністратора",
    adminLead: "Це перший super-admin. Пароль щонайменше 12 символів.",
    email: "Email",
    installTitle: "Встановлення",
    installLead: "Застосовуємо перевірку, конфігурацію, базу, адміністратора і тему.",
    doneTitle: "PLAIK встановлено",
    doneLead: "Інсталятор буде закрито. Далі відкрийте публічний сайт і control-center.",
    required: "Обовʼязкове поле",
    fail: "Крок не виконано"
  },
  en: {
    brand: "Installation",
    steps: ["Welcome", "System compatibility", "Site", "Database", "Administrator", "Installation"],
    welcomeTitle: "Welcome to PLAIK",
    welcomeLead: "This wizard follows a classic web installer flow: host checks, site, database and the first administrator.",
    tokenLabel: "Installer token",
    tokenHelp: "Confirm access with the token from /etc/plaik/plaik.env. Loopback may work without it when configured.",
    next: "Next",
    back: "Back",
    start: "Start installation",
    checkTitle: "System compatibility",
    checkLead: "The installer inspects host state before writing configuration.",
    siteTitle: "Site information",
    siteLead: "The domain becomes the public HTTPS URL. No scheme or path.",
    domain: "Domain",
    locale: "Locale",
    timezone: "Timezone",
    dbTitle: "Database configuration",
    dbLead: "Use a detected empty database, enter an existing one, or create a new one with the CLI if this service cannot use postgres peer access.",
    source: "Source",
    useDetected: "Use detected empty database",
    manual: "Enter manually",
    host: "Host",
    port: "Port",
    database: "Database",
    migrator: "Migration user",
    runtime: "Runtime user",
    checkpoint: "Checkpoint user",
    password: "Password",
    ssl: "SSL mode",
    adminTitle: "Administrator account",
    adminLead: "This is the first super-admin. Password must be at least 12 characters.",
    email: "Email",
    installTitle: "Installation",
    installLead: "Applying checks, configuration, database, administrator and theme.",
    doneTitle: "PLAIK is installed",
    doneLead: "The installer will close. Continue to the public site and control-center.",
    required: "Required field",
    fail: "This step failed"
  }
};

const state = {
  lang: "uk",
  step: 0,
  token: sessionStorage.getItem("plaik-installer-token") || "",
  requirements: null,
  form: {
    domain: "",
    locale: "uk-UA",
    timezone: "Europe/Kyiv",
    source: "use-detected",
    host: "127.0.0.1",
    port: "5433",
    database: "plaik",
    username: "plaik_migrator",
    runtime_username: "plaik_runtime",
    checkpoint_username: "plaik_checkpoint",
    migrator_password: "",
    runtime_password: "",
    checkpoint_password: "",
    ssl_mode: "require",
    email: ""
  }
};

const $ = (id) => document.getElementById(id);
const t = () => I18N[state.lang];
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}
function headers() {
  const result = {"Content-Type": "application/json", "Accept": "application/json"};
  if (state.token) result["X-Installer-Token"] = state.token;
  return result;
}
async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: headers(),
    body: body ? JSON.stringify(body) : undefined
  });
  const text = await response.text();
  let data = {};
  if (text) {
    try { data = JSON.parse(text); } catch { data = {detail: text}; }
  }
  if (!response.ok) {
    const detail = data.detail;
    throw new Error(typeof detail === "string" ? detail : t().fail);
  }
  return data;
}
function field(name, label, type, value, extra="") {
  return `<div class="field"><label for="${name}">${escapeHtml(label)}</label>
    <input id="${name}" name="${name}" type="${type}" value="${escapeHtml(value)}" ${extra}></div>`;
}
function renderSteps() {
  $("steps").innerHTML = t().steps.map((label, index) => {
    const cls = index < state.step ? "done" : index === state.step ? "current" : "";
    const mark = index < state.step ? "✓" : String(index + 1);
    return `<li class="${cls}"><button type="button"><span class="num">${mark}</span><span>${escapeHtml(label)}</span></button></li>`;
  }).join("");
  $("brand-sub").textContent = t().brand;
}
function flash(message, kind) {
  return message ? `<div class="flash ${kind}">${escapeHtml(message)}</div>` : "";
}
function actions(back, nextLabel) {
  return `<div class="actions">
    <button type="button" class="ghost" id="back" ${back ? "" : "disabled"}>${escapeHtml(t().back)}</button>
    <button type="submit" class="primary" id="next">${escapeHtml(nextLabel || t().next)}</button>
  </div>`;
}
function readForm() {
  document.querySelectorAll("#panel [name]").forEach((node) => {
    if (node.type === "password" || node.type === "text" || node.type === "email" || node.type === "number" || node.tagName === "SELECT") {
      state.form[node.name] = node.value;
    }
  });
  const token = $("token");
  if (token) {
    state.token = token.value.trim();
    sessionStorage.setItem("plaik-installer-token", state.token);
  }
}
function welcome() {
  return `<h1>${escapeHtml(t().welcomeTitle)}</h1>
    <p class="lead">${escapeHtml(t().welcomeLead)}</p>
    <form id="step-form" class="grid">
      ${field("token", t().tokenLabel, "password", state.token)}
      <p class="lead">${escapeHtml(t().tokenHelp)}</p>
      ${actions(false, t().next)}
    </form>`;
}
function checks() {
  const items = [
    ...(state.requirements?.checks || []),
    ...(state.requirements?.observations || [])
  ];
  const rows = items.map((item) => `<li><span class="dot ${item.passed ? "ok" : "bad"}"></span>
    <div><strong>${escapeHtml(item.id)}</strong><div class="lead">${escapeHtml(item.detail)}</div></div></li>`).join("");
  return `<h1>${escapeHtml(t().checkTitle)}</h1>
    <p class="lead">${escapeHtml(t().checkLead)}</p>
    <form id="step-form">
      <ul class="checks">${rows || `<li>${escapeHtml(t().fail)}</li>`}</ul>
      ${actions(true)}
    </form>`;
}
function site() {
  return `<h1>${escapeHtml(t().siteTitle)}</h1>
    <p class="lead">${escapeHtml(t().siteLead)}</p>
    <form id="step-form" class="grid two">
      ${field("domain", t().domain, "text", state.form.domain, "required")}
      ${field("locale", t().locale, "text", state.form.locale, "required")}
      ${field("timezone", t().timezone, "text", state.form.timezone, "required")}
      ${actions(true)}
    </form>`;
}
function database() {
  return `<h1>${escapeHtml(t().dbTitle)}</h1>
    <p class="lead">${escapeHtml(t().dbLead)}</p>
    <form id="step-form" class="grid two">
      <div class="field"><label for="source">${escapeHtml(t().source)}</label>
        <select id="source" name="source">
          <option value="use-detected"${state.form.source === "use-detected" ? " selected" : ""}>${escapeHtml(t().useDetected)}</option>
          <option value="manual"${state.form.source === "manual" ? " selected" : ""}>${escapeHtml(t().manual)}</option>
        </select>
      </div>
      ${field("host", t().host, "text", state.form.host)}
      ${field("port", t().port, "number", state.form.port)}
      ${field("database", t().database, "text", state.form.database)}
      ${field("username", t().migrator, "text", state.form.username)}
      ${field("runtime_username", t().runtime, "text", state.form.runtime_username)}
      ${field("checkpoint_username", t().checkpoint, "text", state.form.checkpoint_username)}
      ${field("migrator_password", t().password + " (migrator)", "password", state.form.migrator_password, "required")}
      ${field("runtime_password", t().password + " (runtime)", "password", state.form.runtime_password, "required")}
      ${field("checkpoint_password", t().password + " (checkpoint)", "password", state.form.checkpoint_password, "required")}
      <div class="field"><label for="ssl_mode">${escapeHtml(t().ssl)}</label>
        <select id="ssl_mode" name="ssl_mode">
          ${["require","verify-ca","verify-full","prefer"].map((mode) =>
            `<option value="${mode}"${state.form.ssl_mode === mode ? " selected" : ""}>${mode}</option>`).join("")}
        </select>
      </div>
      ${actions(true)}
    </form>`;
}
function admin() {
  return `<h1>${escapeHtml(t().adminTitle)}</h1>
    <p class="lead">${escapeHtml(t().adminLead)}</p>
    <form id="step-form" class="grid">
      ${field("email", t().email, "email", state.form.email, "required")}
      ${field("admin_password", t().password, "password", "", "required minlength=12")}
      ${actions(true, t().start)}
    </form>`;
}
function install() {
  return `<h1>${escapeHtml(t().installTitle)}</h1>
    <p class="lead">${escapeHtml(t().installLead)}</p>
    <div class="progress"><span id="bar"></span></div>
    <div class="log" id="log"></div>`;
}
function done() {
  return `<div class="done-box">
    <h1>${escapeHtml(t().doneTitle)}</h1>
    <p class="lead">${escapeHtml(t().doneLead)}</p>
  </div>`;
}
function render(error) {
  renderSteps();
  const views = [welcome, checks, site, database, admin, install];
  $("panel").innerHTML = flash(error, "bad") + (state.step >= 6 ? done() : views[state.step]());
  $("top-title").textContent = t().steps[Math.min(state.step, 5)];
  const form = $("step-form");
  if (form) {
    form.addEventListener("submit", onNext);
    const back = $("back");
    if (back) back.addEventListener("click", () => { if (state.step > 0) { state.step -= 1; render(); } });
  }
}
async function onNext(event) {
  event.preventDefault();
  readForm();
  try {
    if (state.step === 0) {
      state.requirements = await api("GET", "/api/install/requirements");
      if (state.requirements.passed !== true) throw new Error(t().fail);
    } else if (state.step === 1) {
      await api("POST", "/api/install/transition", {target: "requirements_checked"});
    } else if (state.step === 4) {
      await runInstall(state.form.admin_password);
      return;
    }
    state.step += 1;
    render();
  } catch (error) {
    render(error.message || t().fail);
  }
}
function logLine(text) {
  const log = $("log");
  if (!log) return;
  const row = document.createElement("div");
  row.textContent = text;
  log.appendChild(row);
}
function setBar(percent) {
  const bar = $("bar");
  if (bar) bar.style.width = percent + "%";
}
async function runInstall(adminPassword) {
  state.step = 5;
  render();
  const password = adminPassword || state.form.admin_password;
  const installationId = "plaik-" + Math.random().toString(16).slice(2, 10);
  setBar(10); logLine("requirements");
  await api("POST", "/api/install/transition", {target: "requirements_checked"});
  setBar(25); logLine("credentials");
  await api("POST", "/api/install/credentials", {
    migrator_password: state.form.migrator_password,
    runtime_password: state.form.runtime_password,
    checkpoint_password: state.form.checkpoint_password
  });
  setBar(40); logLine("configuration");
  await api("PUT", "/api/install/configuration", {
    schema_version: 1,
    profile: "standard",
    mode: "production",
    installation_id: installationId,
    group_id: "default-group",
    store_id: "default-store",
    locale: state.form.locale,
    timezone: state.form.timezone,
    public_url: "https://" + state.form.domain.replace(/^https?:\/\//, "").replace(/\/.*$/, ""),
    database: {
      backend: "postgresql",
      host: state.form.host,
      port: Number(state.form.port),
      database: state.form.database,
      username: state.form.username,
      credential: {provider: "local", key: "database/migrator", version: "v1"},
      runtime_username: state.form.runtime_username,
      runtime_credential: {provider: "local", key: "database/runtime", version: "v1"},
      checkpoint_username: state.form.checkpoint_username,
      checkpoint_credential: {provider: "local", key: "database/checkpoint", version: "v1"},
      ssl_mode: state.form.ssl_mode
    },
    sealed: false,
    sealed_at: null
  });
  setBar(55); logLine("database");
  await api("POST", "/api/install/transition", {target: "configured"});
  await api("POST", "/api/install/transition", {target: "database_ready"});
  setBar(75); logLine("administrator");
  await api("POST", "/api/install/admin", {email: state.form.email, password});
  await api("POST", "/api/install/transition", {target: "admin_ready"});
  setBar(90); logLine("theme");
  await api("POST", "/api/install/transition", {target: "theme_ready"});
  await api("POST", "/api/install/transition", {target: "completed"});
  setBar(100);
  state.step = 6;
  render();
}
$("lang").value = state.lang;
$("lang").addEventListener("change", (event) => { state.lang = event.target.value; document.documentElement.lang = state.lang; render(); });
render();
</script>
</body>
</html>
