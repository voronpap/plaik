name: Apply PLAIK public final fixes

on:
  push:
    branches: [migration/verify-public-final]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove final legacy public identifier
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/plaik_core/package_migrations.py')
          text = path.read_text(encoding='utf-8')
          old = 'MODULARIS_PKG_[A-Z0-9_]+'
          new = 'PLAIK_PKG_[A-Z0-9_]+'
          if old not in text:
              raise SystemExit('expected legacy package-schema identifier not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          ! grep -RniE 'modularis|storefront' --exclude-dir=.git .
          rm -f .github/workflows/apply-public-final-fixes.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove final legacy public identifiers'
          git push
