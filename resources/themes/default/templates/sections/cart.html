<section id="main-content" class="plaik-cart" aria-labelledby="plaik-cart-title">
  <h1 id="plaik-cart-title">{{ theme_strings.cart_title }}</h1>
  {{ slot("storefront.cart.items") }}
  <p class="plaik-empty" data-ui-state="empty">{{ theme_strings.empty_cart }}</p>
  {{ slot("storefront.cart.summary") }}
  <div class="plaik-actions">
    {{ slot("storefront.cart.actions") }}
    <a class="plaik-button plaik-button-primary" href="#checkout">{{ theme_strings.cart_checkout }}</a>
  </div>
</section>
