<!doctype html>
<html lang="{{ locale }}" dir="{{ text_direction | default('ltr') }}" data-web-theme="default" data-plaik-layout="checkout">
  {% set web_url = public_url | default("") %}
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="{{ theme_strings.meta_description }}">
    <title>{{ page.title }}</title>
    {{ theme_assets("css") }}
    {{ hook("displayHeader") }}
  </head>
  <body class="plaik-checkout-shell">
    <a class="plaik-skip-link" href="#main-content">{{ theme_strings.skip_to_content }}</a>
    {{ composition }}
    {{ hook("displayContent") }}
    {{ hook("displayFooter") }}
  </body>
</html>
